blueprint:
  name: PrusaLink print live activity
  description: >
    Mirrors an in-progress PrusaLink print to a mobile app Live Activity /
    Live Update, tracking progress and ETA and handling pauses, completion,
    cancellation, errors, and offline states. Progress updates are silent.
    The final outcome (complete, stopped, canceled, error) updates the same
    notification with an alert and stays until dismissed: on Android it
    becomes a regular notification, on iOS the Live Activity keeps its final
    state. iOS limits Live Activities to about 8 hours, plus up to 4 hours on
    the Lock Screen after that, so very long prints or an undismissed result
    are eventually removed by iOS.
  domain: automation
  source_url: https://github.com/ysmilda/home-assistant-blueprints/blob/main/blueprints/automation/prusalink-live-update.yaml
  input:
    printer:
      name: Printer status sensor
      description: The PrusaLink printer state sensor (enum) for the printer to track.
      selector:
        entity:
          domain: sensor
          device_class: enum
          integration: prusalink
    progress:
      name: Progress sensor
      description: The PrusaLink progress sensor for the same printer.
      selector:
        entity:
          domain: sensor
          integration: prusalink
    notify_device:
      name: Mobile devices
      description: The Home Assistant Companion App devices that show the Live Activity / Live Update.
      selector:
        device:
          integration: mobile_app
          multiple: true
    print_tag_helper:
      name: Print tag helper
      description: >
        Text helper that stores the tag of the current print, so each print
        gets its own Live Activity / Live Update. Create an empty
        input_text helper for each printer.
      selector:
        entity:
          domain: input_text
    notification_url:
      name: Notification link
      description: >
        Page to open when a notification is tapped. Use a Home Assistant path
        such as /lovelace/3d-printer or a full URL such as
        http://prusa-mk4.local. Leave empty to open the default dashboard.
      default: ''
      selector:
        text: {}
variables:
  printer: !input printer
  progress_entity: !input progress
  tag_helper: !input print_tag_helper
  notify_device: !input notify_device
  notification_url: !input notification_url
  click_url: "{{ notification_url | trim if notification_url | trim else '/' }}"
  notify_targets: >-
    {% set devices = [notify_device] if notify_device is string else notify_device %}
    {% set ns = namespace(targets=[]) %}
    {% for device in devices %}
    {% set ns.targets = ns.targets + [{
      'action': 'notify.mobile_app_' ~ (device_attr(device, 'name') | slugify),
      'apple': device_attr(device, 'manufacturer') == 'Apple'
    }] %}
    {% endfor %}
    {{ ns.targets }}
  base_tag: "{{ (printer | replace('sensor.', '')) ~ '_print' }}"
  stored_tag: >-
    {% set tag = states(tag_helper) %}
    {{ tag if tag not in ['unknown', 'unavailable', 'none', ''] else '' }}
  activity_tag: "{{ stored_tag if stored_tag else base_tag }}"
  printer_state: "{{ states(printer) }}"
  progress_pct: "{{ states(progress_entity) | int(0) }}"
  filename: "{{ states(printer ~ '_filename') }}"
  notification_title: >-
    {{ filename if filename not in ['unknown', 'unavailable', 'none', ''] else 'PrusaLink print' }}
  print_finish_ts: >-
    {% set raw = states(printer ~ '_print_finish') %}
    {% if raw in ['unknown', 'unavailable', 'none', ''] %}
    {{ 0 }}
    {% else %}
    {% set ts = raw | as_timestamp %}
    {{ (ts | int(0)) if ts is not none else 0 }}
    {% endif %}
triggers:
  - trigger: state
    id: started
    entity_id: !input printer
    to: printing
  - trigger: state
    id: paused
    entity_id: !input printer
    from:
      - printing
      - unavailable
      - unknown
    to: paused
  - trigger: state
    id: progress
    entity_id: !input progress
  - trigger: state
    id: finished
    entity_id: !input printer
    from:
      - printing
      - paused
      - unavailable
      - unknown
    to: finished
  - trigger: state
    id: stopped
    entity_id: !input printer
    from:
      - printing
      - paused
      - unavailable
      - unknown
    to: stopped
  - trigger: state
    id: error
    entity_id: !input printer
    from:
      - printing
      - paused
      - unavailable
      - unknown
    to:
      - error
      - attention
  - trigger: state
    id: offline
    entity_id: !input printer
    from:
      - printing
      - paused
    to:
      - unavailable
      - unknown
  - trigger: state
    id: cancelled_via_idle
    entity_id: !input printer
    from:
      - printing
      - paused
      - unavailable
      - unknown
    to: idle
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: started
        sequence:
          - variables:
              resumed: >-
                {{ trigger.from_state is not none
                   and trigger.from_state.state in ['paused', 'unavailable', 'unknown']
                   and stored_tag != '' }}
              activity_tag: >-
                {{ stored_tag if resumed else base_tag ~ '_' ~ (now() | as_timestamp | int) }}
          - action: input_text.set_value
            target:
              entity_id: !input print_tag_helper
            data:
              value: "{{ activity_tag }}"
          - repeat:
              for_each: "{{ notify_targets }}"
              sequence:
                - action: "{{ repeat.item.action }}"
                  data:
                    title: "{{ notification_title }}"
                    message: Started printing
                    data:
                      tag: "{{ activity_tag }}"
                      live_update: true
                      progress: "{{ progress_pct }}"
                      progress_max: 100
                      notification_icon: mdi:printer-3d-nozzle
                      notification_icon_color: '#FF6900'
                      color: '#FF6900'
                      url: "{{ click_url }}"
                      clickAction: "{{ click_url }}"
                      silent: true
                      alert_once: true
      - conditions:
          - condition: trigger
            id: paused
        sequence:
          - repeat:
              for_each: "{{ notify_targets }}"
              sequence:
                - action: "{{ repeat.item.action }}"
                  data:
                    title: "{{ notification_title }}"
                    message: "Paused at {{ progress_pct }}%"
                    data:
                      tag: "{{ activity_tag }}"
                      live_update: true
                      progress: "{{ progress_pct }}"
                      progress_max: 100
                      chronometer: false
                      notification_icon: mdi:pause-circle-outline
                      notification_icon_color: '#FFC107'
                      color: '#FFC107'
                      url: "{{ click_url }}"
                      clickAction: "{{ click_url }}"
                      silent: true
                      alert_once: true
      - conditions:
          - condition: trigger
            id: progress
          - condition: state
            entity_id: !input printer
            state:
              - printing
              - paused
        sequence:
          - if:
              - condition: template
                value_template: "{{ states(printer ~ '_print_finish') not in ['unknown', 'unavailable', 'none', ''] }}"
            then:
              - repeat:
                  for_each: "{{ notify_targets }}"
                  sequence:
                    - action: "{{ repeat.item.action }}"
                      data:
                        title: "{{ notification_title }}"
                        message: "Printing · {{ progress_pct }}%"
                        data:
                          tag: "{{ activity_tag }}"
                          live_update: true
                          progress: "{{ progress_pct }}"
                          progress_max: 100
                          chronometer: true
                          when: "{{ print_finish_ts }}"
                          notification_icon: mdi:printer-3d-nozzle
                          notification_icon_color: '#FF6900'
                          color: '#FF6900'
                          url: "{{ click_url }}"
                          clickAction: "{{ click_url }}"
                          silent: true
                          alert_once: true
            else:
              - repeat:
                  for_each: "{{ notify_targets }}"
                  sequence:
                    - action: "{{ repeat.item.action }}"
                      data:
                        title: "{{ notification_title }}"
                        message: "Printing · {{ progress_pct }}%"
                        data:
                          tag: "{{ activity_tag }}"
                          live_update: true
                          progress: "{{ progress_pct }}"
                          progress_max: 100
                          chronometer: false
                          notification_icon: mdi:printer-3d-nozzle
                          notification_icon_color: '#FF6900'
                          color: '#FF6900'
                          url: "{{ click_url }}"
                          clickAction: "{{ click_url }}"
                          silent: true
                          alert_once: true
      - conditions:
          - condition: trigger
            id:
              - finished
              - stopped
              - error
              - cancelled_via_idle
          - condition: template
            value_template: >-
              {{ trigger.from_state.state in ['printing', 'paused'] or stored_tag != '' }}
        sequence:
          - variables:
              final_message: >-
                {{ {
                  'finished': 'Print complete',
                  'stopped': 'Print stopped',
                  'cancelled_via_idle': 'Print canceled',
                  'error': 'Printer error' if printer_state == 'error' else 'Printer needs attention'
                }[trigger.id] }}
              final_icon: >-
                {{ {
                  'finished': 'mdi:check-circle-outline',
                  'stopped': 'mdi:stop-circle-outline',
                  'cancelled_via_idle': 'mdi:cancel',
                  'error': 'mdi:alert-circle-outline'
                }[trigger.id] }}
              final_color: "{{ '#4CAF50' if trigger.id == 'finished' else '#F44336' }}"
          - action: input_text.set_value
            target:
              entity_id: !input print_tag_helper
            data:
              value: ''
          - repeat:
              for_each: "{{ notify_targets }}"
              sequence:
                - action: "{{ repeat.item.action }}"
                  data:
                    title: "{{ notification_title }}"
                    message: "{{ final_message }}"
                    data: >-
                      {% set payload = {
                        'tag': activity_tag,
                        'chronometer': false,
                        'notification_icon': final_icon,
                        'notification_icon_color': final_color,
                        'color': final_color,
                        'url': click_url,
                        'clickAction': click_url
                      } %}
                      {% if trigger.id != 'finished' %}
                      {% set payload = dict(payload, progress=progress_pct, progress_max=100) %}
                      {% endif %}
                      {{ dict(payload, live_update=true) if repeat.item.apple else payload }}
      - conditions:
          - condition: trigger
            id: offline
        sequence:
          - repeat:
              for_each: "{{ notify_targets }}"
              sequence:
                - action: "{{ repeat.item.action }}"
                  data:
                    title: "{{ notification_title }}"
                    message: Printer offline
                    data:
                      tag: "{{ activity_tag }}"
                      live_update: true
                      progress: "{{ progress_pct }}"
                      progress_max: 100
                      chronometer: false
                      notification_icon: mdi:cloud-off-outline
                      notification_icon_color: '#9E9E9E'
                      color: '#9E9E9E'
                      url: "{{ click_url }}"
                      clickAction: "{{ click_url }}"
                      silent: true
                      alert_once: true
mode: queued
max: 10
